# Generated from packages/shared Zod schemas. Do not edit by hand.
openapi: 3.1.0
info:
  title: Quick Commerce API
  version: 0.1.0
  description: Auth, catalog, cart, checkout, orders, serviceability, health, and
    the shared error contract. Schemas are generated from packages/shared.
servers:
  - url: /
tags:
  - name: Auth
  - name: Catalog
  - name: Cart
  - name: Orders
  - name: Serviceability
  - name: System
paths:
  /v1/auth/signup:
    post:
      operationId: signup
      summary: Create a customer account and sign in
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Customer created. Sets the qc_rt refresh cookie.
          headers:
            Set-Cookie:
              description: qc_rt refresh token. HttpOnly, Secure, SameSite=Strict,
                Path=/v1/auth.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Request body is not valid JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: EMAIL_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: VALIDATION
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/auth/login:
    post:
      operationId: login
      summary: Log in with email and password
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in. Sets the qc_rt refresh cookie.
          headers:
            Set-Cookie:
              description: qc_rt refresh token. HttpOnly, Secure, SameSite=Strict,
                Path=/v1/auth.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Request body is not valid JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: VALIDATION
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: ACCOUNT_LOCKED. details[0].retryAfter is seconds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/auth/refresh:
    post:
      operationId: refresh
      summary: Rotate the refresh cookie and issue a new access token
      tags:
        - Auth
      parameters:
        - in: header
          name: X-Requested-With
          required: true
          schema:
            type: string
        - in: cookie
          name: qc_rt
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Access token issued and qc_rt rotated.
          headers:
            Set-Cookie:
              description: Replacement qc_rt cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          description: TOKEN_INVALID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing X-Requested-With or foreign Origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current refresh token and clear the cookie
      tags:
        - Auth
      parameters:
        - in: header
          name: X-Requested-With
          required: true
          schema:
            type: string
        - in: cookie
          name: qc_rt
          required: false
          schema:
            type: string
      responses:
        "204":
          description: Refresh token revoked and cookie cleared.
        "403":
          description: Missing X-Requested-With or foreign Origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/auth/logout-all:
    post:
      operationId: logoutAll
      summary: Revoke every session for the current user
      tags:
        - Auth
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Requested-With
          required: true
          schema:
            type: string
      responses:
        "204":
          description: users.token_version incremented, every refresh token revoked,
            cookie cleared.
        "401":
          description: UNAUTHORIZED or TOKEN_INVALID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing X-Requested-With or foreign Origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/auth/me:
    get:
      operationId: me
      summary: Current user and the latest delivery address
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile. lastAddress is null until the user has placed an order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: UNAUTHORIZED, TOKEN_INVALID, or TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/categories:
    get:
      operationId: listCategories
      summary: Active categories and their active subcategories
      tags:
        - Catalog
      responses:
        "200":
          description: Active rows in sort order. Cached for 60 seconds.
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCategoryList"
        "304":
          description: Not modified
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/admin/categories:
    get:
      operationId: listAdminCategories
      summary: Admin category list
      tags:
        - Catalog
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: includeInactive
          schema:
            type: string
            enum:
              - "true"
              - "false"
      responses:
        "200":
          description: Non-deleted categories with counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCategoryList"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCategory
      summary: Create a category
      tags:
        - Catalog
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategory"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: NAME_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: VALIDATION or IMAGE_HOST_NOT_ALLOWED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/admin/categories/{id}:
    patch:
      operationId: updateCategory
      summary: Update a category
      tags:
        - Catalog
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategory"
      responses:
        "200":
          description: Category updated. The slug assigned at create does not change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: NAME_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: VALIDATION or IMAGE_HOST_NOT_ALLOWED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCategory
      summary: Soft-delete an empty category
      tags:
        - Catalog
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Soft-deleted
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: CATEGORY_NOT_EMPTY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/admin/categories/{id}/subcategories:
    post:
      operationId: createSubcategory
      summary: Add a subcategory
      tags:
        - Catalog
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubcategory"
      responses:
        "201":
          description: Subcategory created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubcategoryResponse"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: NAME_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: VALIDATION
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/admin/subcategories/{id}:
    patch:
      operationId: updateSubcategory
      summary: Update or move a subcategory
      tags:
        - Catalog
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubcategory"
      responses:
        "200":
          description: Subcategory updated. Products stay on this subcategory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubcategoryResponse"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: NAME_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: VALIDATION
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSubcategory
      summary: Soft-delete an empty subcategory
      tags:
        - Catalog
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Soft-deleted
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: SUBCATEGORY_NOT_EMPTY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/products:
    get:
      operationId: listProducts
      summary: Search and list active products
      tags:
        - Catalog
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: categoryId
          schema:
            type: string
            format: uuid
        - in: query
          name: subcategoryId
          schema:
            type: string
            format: uuid
        - in: query
          name: minPrice
          schema:
            type: integer
          description: Paise
        - in: query
          name: maxPrice
          schema:
            type: integer
          description: Paise
        - in: query
          name: inStock
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - in: query
          name: sort
          schema:
            type: string
            enum:
              - relevance
              - price_asc
              - price_desc
              - newest
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 24
      responses:
        "200":
          description: Page of product cards. total is capped at 1000.
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "304":
          description: Not modified
        "422":
          description: VALIDATION
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/products/{slug}:
    get:
      operationId: getProduct
      summary: Active product detail
      tags:
        - Catalog
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product, category, subcategory, and stock status
          headers:
            Cache-Control:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetailResponse"
        "304":
          description: Not modified
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/admin/products:
    get:
      operationId: listAdminProducts
      summary: Admin product list
      tags:
        - Catalog
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: categoryId
          schema:
            type: string
            format: uuid
        - in: query
          name: subcategoryId
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            type: string
            enum:
              - active
              - inactive
              - deleted
        - in: query
          name: lowStock
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            maximum: 20
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Products, including inactive or deleted when filtered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductListResponse"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: VALIDATION
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createProduct
      summary: Create a product
      tags:
        - Catalog
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProduct"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductResponse"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Subcategory not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: SKU_TAKEN or SLUG_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: VALIDATION or IMAGE_HOST_NOT_ALLOWED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/admin/products/{id}:
    get:
      operationId: getAdminProduct
      summary: Admin product detail
      tags:
        - Catalog
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Product, including inactive or deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductResponse"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProduct
      summary: Update a product
      tags:
        - Catalog
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProduct"
      responses:
        "200":
          description: Product updated. Existing order lines keep their price snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProductResponse"
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: SKU_TAKEN or SLUG_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: VALIDATION or IMAGE_HOST_NOT_ALLOWED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProduct
      summary: Soft-delete a product
      tags:
        - Catalog
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Soft-deleted. Hidden from the storefront. Order history keeps its
            snapshot.
        "401":
          description: UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/serviceability:
    get:
      operationId: checkServiceability
      summary: Whether a pincode is in SERVICEABLE_PINCODES
      tags:
        - Serviceability
      parameters:
        - in: query
          name: pincode
          required: true
          schema:
            type: string
            pattern: ^[1-9][0-9]{5}$
      responses:
        "200":
          description: serviceable is false for a valid pincode outside the allowlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceabilityResponse"
        "422":
          description: VALIDATION for a pincode that is not 6 digits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/cart:
    get:
      operationId: getCart
      summary: Current customer cart with server-side totals
      tags:
        - Cart
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cart. Unavailable lines are flagged and excluded from the subtotal.
