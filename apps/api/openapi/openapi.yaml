components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    jobsToken:
      type: apiKey
      in: header
      name: X-Jobs-Token
  schemas:
    SignupRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        password:
          type: string
          minLength: 8
          maxLength: 72
          allOf:
            - pattern: "[A-Za-z]"
            - pattern: "[0-9]"
        phone:
          type: string
          maxLength: 15
          pattern: ^\+[1-9]\d{1,14}$
      required:
        - name
        - email
        - password
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        password:
          type: string
          minLength: 1
          maxLength: 72
      required:
        - email
        - password
      additionalProperties: false
    AuthSession:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            name:
              type: string
            email:
              type: string
              format: email
              pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            role:
              type: string
              enum:
                - ADMIN
                - CUSTOMER
          required:
            - id
            - name
            - email
            - role
          additionalProperties: false
        accessToken:
          type: string
          minLength: 1
      required:
        - user
        - accessToken
      additionalProperties: false
    AccessTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          minLength: 1
      required:
        - accessToken
      additionalProperties: false
    MeResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            name:
              type: string
            email:
              type: string
              format: email
              pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            role:
              type: string
              enum:
                - ADMIN
                - CUSTOMER
            lastAddress:
              anyOf:
                - type: object
                  properties:
                    name:
                      type: string
                    phone:
                      type: string
                    line1:
                      type: string
                    line2:
                      type:
                        - string
                        - "null"
                    city:
                      type: string
                    state:
                      type: string
                    pincode:
                      type: string
                  required:
                    - name
                    - phone
                    - line1
                    - line2
                    - city
                    - state
                    - pincode
                  additionalProperties: false
                - type: "null"
          required:
            - id
            - name
            - email
            - role
            - lastAddress
          additionalProperties: false
      required:
        - user
      additionalProperties: false
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
        db:
          type: string
          enum:
            - up
            - down
        version:
          type: string
          minLength: 1
      required:
        - status
        - db
        - version
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              minLength: 1
            message:
              type: string
              minLength: 1
            details:
              type: array
              items: {}
            requestId:
              type: string
              minLength: 1
          required:
            - code
            - message
            - requestId
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    PublicCategoryList:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          name:
            type: string
          slug:
            type: string
          imageUrl:
            type:
              - string
              - "null"
          subcategories:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                name:
                  type: string
                slug:
                  type: string
              required:
                - id
                - name
                - slug
              additionalProperties: false
        required:
          - id
          - name
          - slug
          - imageUrl
          - subcategories
        additionalProperties: false
    AdminCategoryList:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          name:
            type: string
          slug:
            type: string
          description:
            type:
              - string
              - "null"
          imageUrl:
            type:
              - string
              - "null"
          sortOrder:
            type: integer
            minimum: -9007199254740991
            maximum: 9007199254740991
          isActive:
            type: boolean
          subcategoryCount:
            type: integer
            minimum: -9007199254740991
            maximum: 9007199254740991
          productCount:
            type: integer
            minimum: -9007199254740991
            maximum: 9007199254740991
          subcategories:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                categoryId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                name:
                  type: string
                slug:
                  type: string
                description:
                  type:
                    - string
                    - "null"
                sortOrder:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                isActive:
                  type: boolean
              required:
                - id
                - categoryId
                - name
                - slug
                - description
                - sortOrder
                - isActive
              additionalProperties: false
        required:
          - id
          - name
          - slug
          - description
          - imageUrl
          - sortOrder
          - isActive
          - subcategoryCount
          - productCount
          - subcategories
        additionalProperties: false
    CategoryResponse:
      type: object
      properties:
        category:
          type: object
          properties:
            id:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            name:
              type: string
            slug:
              type: string
            description:
              type:
                - string
                - "null"
            imageUrl:
              type:
                - string
                - "null"
            sortOrder:
