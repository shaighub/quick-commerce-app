# Generated from packages/shared Zod schemas. Do not edit by hand.
openapi: 3.1.0
info:
  title: Quick Commerce API
  version: 0.1.0
  description: Auth, health, and the shared error contract. Schemas are generated
    from packages/shared. Later milestones add catalog, cart, and orders.
servers:
  - url: /
tags:
  - name: Auth
  - name: System
paths:
  /v1/auth/signup:
    post:
      operationId: signup
      summary: Create a customer account and sign in
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Customer created. Sets the qc_rt refresh cookie.
          headers:
            Set-Cookie:
              description: qc_rt refresh token. HttpOnly, Secure, SameSite=Strict,
                Path=/v1/auth.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Request body is not valid JSON
          content: &a1
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: EMAIL_TAKEN
          content: *a1
        "422":
          description: VALIDATION
          content: *a1
        "429":
          description: RATE_LIMITED
          content: *a1
  /v1/auth/login:
    post:
      operationId: login
      summary: Log in with email and password
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in. Sets the qc_rt refresh cookie.
          headers:
            Set-Cookie:
              description: qc_rt refresh token. HttpOnly, Secure, SameSite=Strict,
                Path=/v1/auth.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Request body is not valid JSON
          content: *a1
        "401":
          description: INVALID_CREDENTIALS
          content: *a1
        "422":
          description: VALIDATION
          content: *a1
        "423":
          description: ACCOUNT_LOCKED. details[0].retryAfter is seconds.
          content: *a1
        "429":
          description: RATE_LIMITED
          content: *a1
  /v1/auth/refresh:
    post:
      operationId: refresh
      summary: Rotate the refresh cookie and issue a new access token
      tags:
        - Auth
      parameters:
        - in: header
          name: X-Requested-With
          required: true
          schema:
            type: string
        - in: cookie
          name: qc_rt
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Access token issued and qc_rt rotated.
          headers:
            Set-Cookie:
              description: Replacement qc_rt cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          description: TOKEN_INVALID
          content: *a1
        "403":
          description: Missing X-Requested-With or foreign Origin
          content: *a1
        "429":
          description: RATE_LIMITED
          content: *a1
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current refresh token and clear the cookie
      tags:
        - Auth
      parameters:
        - in: header
          name: X-Requested-With
          required: true
          schema:
            type: string
        - in: cookie
          name: qc_rt
          required: false
          schema:
            type: string
      responses:
        "204":
          description: Refresh token revoked and cookie cleared.
        "403":
          description: Missing X-Requested-With or foreign Origin
          content: *a1
        "429":
          description: RATE_LIMITED
          content: *a1
  /v1/auth/logout-all:
    post:
      operationId: logoutAll
      summary: Revoke every session for the current user
      tags:
        - Auth
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Requested-With
          required: true
          schema:
            type: string
      responses:
        "204":
          description: users.token_version incremented, every refresh token revoked,
            cookie cleared.
        "401":
          description: UNAUTHORIZED or TOKEN_INVALID
          content: *a1
        "403":
          description: Missing X-Requested-With or foreign Origin
          content: *a1
        "429":
          description: RATE_LIMITED
          content: *a1
  /v1/auth/me:
    get:
      operationId: me
      summary: Current user and the latest delivery address
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile. lastAddress is null until the user has placed an order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: UNAUTHORIZED, TOKEN_INVALID, or TOKEN_EXPIRED
          content: *a1
        "429":
          description: RATE_LIMITED
          content: *a1
  /v1/health:
    get:
      operationId: getHealth
      summary: Health check
      tags:
        - System
      responses:
        "200":
          description: Database is reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Database is not reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SignupRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        password:
          type: string
          minLength: 8
          maxLength: 72
          allOf:
            - pattern: "[A-Za-z]"
            - pattern: "[0-9]"
        phone:
          type: string
          maxLength: 15
          pattern: ^\+[1-9]\d{1,14}$
      required:
        - name
        - email
        - password
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        password:
          type: string
          minLength: 1
          maxLength: 72
      required:
        - email
        - password
      additionalProperties: false
    AuthSession:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            name:
              type: string
            email:
              type: string
              format: email
              pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            role:
              type: string
              enum:
                - ADMIN
                - CUSTOMER
          required:
            - id
            - name
            - email
            - role
          additionalProperties: false
        accessToken:
          type: string
          minLength: 1
      required:
        - user
        - accessToken
      additionalProperties: false
    AccessTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          minLength: 1
      required:
        - accessToken
      additionalProperties: false
    MeResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            name:
              type: string
            email:
              type: string
              format: email
              pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
            role:
              type: string
              enum:
                - ADMIN
                - CUSTOMER
            lastAddress:
              anyOf:
                - type: object
                  properties:
                    name:
                      type: string
                    phone:
                      type: string
                    line1:
                      type: string
                    line2:
                      type:
                        - string
                        - "null"
                    city:
                      type: string
                    state:
                      type: string
                    pincode:
                      type: string
                  required:
                    - name
                    - phone
                    - line1
                    - line2
                    - city
                    - state
                    - pincode
                  additionalProperties: false
                - type: "null"
          required:
            - id
            - name
            - email
            - role
            - lastAddress
          additionalProperties: false
      required:
        - user
      additionalProperties: false
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
        db:
          type: string
          enum:
            - up
            - down
        version:
          type: string
          minLength: 1
      required:
        - status
        - db
        - version
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              minLength: 1
            message:
              type: string
              minLength: 1
            details:
              type: array
              items: {}
            requestId:
              type: string
              minLength: 1
          required:
            - code
            - message
            - requestId
          additionalProperties: false
      required:
        - error
      additionalProperties: false
